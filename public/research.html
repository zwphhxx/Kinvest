<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinvest 深度研究</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b7a6e'/%3E%3Cpath d='M17 14v36h8V36l15 14h11L31 31l18-17H38L25 28V14z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/app.css" />
  <link rel="stylesheet" href="/auth.css" />
  <link rel="stylesheet" href="/research.css" />
</head>
<body>
  <main id="research-checking" class="checking-shell" role="status" aria-live="polite">
    <div class="checking-mark" aria-hidden="true">K</div>
    <p id="research-checking-text">正在确认这台设备的家庭访问状态…</p>
    <button id="research-retry" class="auth-secondary hidden" type="button">重新检查</button>
  </main>
  <div id="research-content" class="research-wrap hidden">
    <header class="card">
      <p class="eyebrow">AI生成（示例版）</p>
      <h1>深度研究页</h1>
      <p id="research-header" class="subline">加载中…</p>
      <p><a href="/" class="chip">返回公司页</a></p>
    </header>

    <section id="research-body" class="card hidden">
      <h2>研究快照（不可变版本）</h2>
      <div id="research-meta" class="status-box"></div>
      <section class="section">
        <h3>核心观点</h3>
        <p id="thesis"></p>
      </section>
      <section class="section">
        <h3>多头逻辑</h3>
        <ul id="bulls"></ul>
      </section>
      <section class="section">
        <h3>反方观点与主要风险</h3>
        <ul id="bears"></ul>
      </section>
      <section class="section">
        <h3>催化剂与证伪条件</h3>
        <div id="catalysts"></div>
      </section>
      <section class="section">
        <h3>异常原因与后续观察</h3>
        <p id="invalidation"></p>
      </section>
    </section>

    <section class="card">
      <h2>引用与追溯</h2>
      <p>所有数字标签应可回链到公司数据页（示例）：</p>
      <a id="back-link" href="/" class="chip">查看对应公司数据</a>
      <p class="tag meta">仅模型输出，不替代来源数字；模型失败不影响公司数据页。</p>
    </section>
  </div>

  <script src="/auth-contract.js" defer></script>
  <script src="/research-contract.js" defer></script>
  <script src="/research.js" defer></script>
</body>
</html>
