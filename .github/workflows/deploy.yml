name: Deploy Kinvest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinvest-production
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run check

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit high severity dependencies
        run: npm audit --audit-level=high
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_path=''
          forbidden_kind=''
          while IFS= read -r -d '' path; do
            normalized_path="$(printf '%s_' "$path" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
            normalized_path="${normalized_path%_}"
            case "$normalized_path" in
              .env|*/.env|.env.*|*/.env.*)
                case "$normalized_path" in
                  *.example|*.sample|*.template) ;;
                  *)
                    forbidden_kind='environment file'
                    forbidden_path="$path"
                    break
                    ;;
                esac
                ;;
            esac
            case "${normalized_path##*/}" in
              id_rsa|id_dsa|id_ecdsa|id_ed25519|*.key|*.p12|*.pfx|*.jks|*.keystore|*.der)
                forbidden_kind='private key file'
                forbidden_path="$path"
                break
                ;;
            esac
          done < <(git ls-files -z)

          if [[ -n "$forbidden_path" ]]; then
            printf 'A forbidden %s is tracked: %q\n' "$forbidden_kind" "$forbidden_path" >&2
            exit 1
          fi

          private_key_prefix='BEGIN [A-Z ]*PRIVATE'
          private_key_suffix=' KEY'
          private_key_pattern="${private_key_prefix}${private_key_suffix}"
          if git grep -IlE "$private_key_pattern" -- . >/dev/null; then
            printf '%s\n' 'Private key material was found in a tracked file.' >&2
            exit 1
          fi

          github_prefix='gh[pousr]_'
          github_fine_prefix='github_''pat_'
          aws_prefix='AK''IA'
          google_prefix='AI''za'
          stripe_prefix='sk_''live_'
          slack_prefix='xox''[baprs]-'
          secret_pattern="(${github_prefix}[A-Za-z0-9]{36,}|${github_fine_prefix}[A-Za-z0-9_]{20,}|${aws_prefix}[A-Z0-9]{16}|${google_prefix}[A-Za-z0-9_-]{35}|${stripe_prefix}[A-Za-z0-9]{20,}|${slack_prefix}[A-Za-z0-9-]{20,})"
          if git grep -IlE "$secret_pattern" -- . >/dev/null; then
            printf '%s\n' 'A value matching a common secret format was found.' >&2
            exit 1
          fi

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build pull request image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          push: false

  publish:
    needs: [verify, security, container-build]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: RegistryPublish
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digest.outputs.ghcr_image_digest }}
      tcr_image_digest: ${{ steps.digest.outputs.tcr_image_digest }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Tencent Cloud Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - name: Build and publish audit-tagged image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: ghcr.io/zwphhxx/kinvest:${{ github.sha }}
          provenance: true
      - name: Install pinned crane
        shell: bash
        env:
          CRANE_VERSION: 'v0.21.7'
          CRANE_SHA256: '1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230'
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 \
            -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          printf '%s  /tmp/crane.tar.gz\n' "$CRANE_SHA256" | sha256sum -c -
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          rm -f /tmp/crane.tar.gz
          /tmp/crane version
      - name: Validate immutable image digests
        id: digest
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_REF: ghcr.io/zwphhxx/kinvest:${{ github.sha }}
          TCR_REF: ccr.ccs.tencentyun.com/website-dev/kinvest:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'Build action returned an invalid image digest.' >&2
            exit 1
          fi
          GHCR_DIGEST="$(docker buildx imagetools inspect "$GHCR_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'GHCR did not report a valid image digest.' >&2
            exit 1
          fi
          if [[ "$GHCR_DIGEST" != "$BUILD_DIGEST" ]]; then
            printf '%s\n' 'GHCR digest does not match the build output digest.' >&2
            exit 1
          fi

          COPY_SRC="ghcr.io/zwphhxx/kinvest@${GHCR_DIGEST}"
          COPY_ATTEMPTS=3
          COPY_WAIT_SECONDS=2
          copy_log="$(mktemp)"
          attempt=1
          while ((attempt <= COPY_ATTEMPTS)); do
            status=0
            timeout --signal=TERM --kill-after=10s 300s \
              /tmp/crane copy "$COPY_SRC" "$TCR_REF" >"$copy_log" 2>&1 || status=$?
            if ((status == 0)); then
              printf 'TCR registry copy attempt %s of %s succeeded.\n' "$attempt" "$COPY_ATTEMPTS"
              break
            fi
            printf 'TCR registry copy attempt %s of %s failed with exit code %s.\n' \
              "$attempt" "$COPY_ATTEMPTS" "$status"
            if ((attempt >= COPY_ATTEMPTS)); then
              rm -f "$copy_log"
              printf 'TCR registry copy failed after %s attempts.\n' "$COPY_ATTEMPTS" >&2
              exit 1
            fi
            sleep "$COPY_WAIT_SECONDS"
            COPY_WAIT_SECONDS=$((COPY_WAIT_SECONDS * 2))
            attempt=$((attempt + 1))
          done
          rm -f "$copy_log"

          TCR_DIGEST="$(/tmp/crane digest "$TCR_REF")"
          if [[ ! "$TCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'TCR did not report a valid image digest.' >&2
            exit 1
          fi
          printf 'ghcr_image_digest=%s\n' "$GHCR_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'tcr_image_digest=%s\n' "$TCR_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Configure strict SSH trust
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            printf '%s\n' 'Invalid deployment host.' >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || ((DEPLOY_PORT < 1 || DEPLOY_PORT > 65535)); then
            printf '%s\n' 'Invalid deployment port.' >&2
            exit 1
          fi
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          known_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != '22' ]]; then
            known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Deploy exact immutable digest
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.tcr_image_digest }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY='ccr.ccs.tencentyun.com/website-dev/kinvest'
          IMAGE_DIGEST_REF="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then exit 1; fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || ((DEPLOY_PORT < 1 || DEPLOY_PORT > 65535)); then exit 1; fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then exit 1; fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if [[ ! "$IMAGE_DIGEST_REF" =~ ^ccr\.ccs\.tencentyun\.com/website-dev/kinvest@sha256:[0-9a-f]{64}$ ]]; then exit 1; fi
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o LogLevel=ERROR \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $IMAGE_DIGEST_REF $DEPLOY_SHA"
      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
