name: Deploy Kinvest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinvest-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run check

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify isolated deploy-v5 sudoers semantics
        shell: bash
        env:
          KINVEST_RUN_SUDOERS_INTEGRATION: '1'
        run: |
          set -euo pipefail
          node -e "Promise.resolve(require('./server/tests/deploy-v5-installer.test').runSudoersIntegrationOnly()).catch((error) => { console.error(error); process.exit(1) })"
      - name: Audit high severity dependencies
        run: npm audit --audit-level=high
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_path=''
          forbidden_kind=''
          while IFS= read -r -d '' path; do
            normalized_path="$(printf '%s_' "$path" | LC_ALL=C tr '[:upper:]' '[:lower:]')"
            normalized_path="${normalized_path%_}"
            case "$normalized_path" in
              .env|*/.env|.env.*|*/.env.*)
                case "$normalized_path" in
                  *.example|*.sample|*.template) ;;
                  *)
                    forbidden_kind='environment file'
                    forbidden_path="$path"
                    break
                    ;;
                esac
                ;;
            esac
            case "${normalized_path##*/}" in
              id_rsa|id_dsa|id_ecdsa|id_ed25519|*.key|*.p12|*.pfx|*.jks|*.keystore|*.der)
                forbidden_kind='private key file'
                forbidden_path="$path"
                break
                ;;
            esac
          done < <(git ls-files -z)

          if [[ -n "$forbidden_path" ]]; then
            printf 'A forbidden %s is tracked: %q\n' "$forbidden_kind" "$forbidden_path" >&2
            exit 1
          fi

          private_key_prefix='BEGIN [A-Z ]*PRIVATE'
          private_key_suffix=' KEY'
          private_key_pattern="${private_key_prefix}${private_key_suffix}"
          if git grep -IlE "$private_key_pattern" -- . >/dev/null; then
            printf '%s\n' 'Private key material was found in a tracked file.' >&2
            exit 1
          fi

          github_prefix='gh[pousr]_'
          github_fine_prefix='github_''pat_'
          aws_prefix='AK''IA'
          google_prefix='AI''za'
          stripe_prefix='sk_''live_'
          slack_prefix='xox''[baprs]-'
          secret_pattern="(${github_prefix}[A-Za-z0-9]{36,}|${github_fine_prefix}[A-Za-z0-9_]{20,}|${aws_prefix}[A-Z0-9]{16}|${google_prefix}[A-Za-z0-9_-]{35}|${stripe_prefix}[A-Za-z0-9]{20,}|${slack_prefix}[A-Za-z0-9-]{20,})"
          if git grep -IlE "$secret_pattern" -- . >/dev/null; then
            printf '%s\n' 'A value matching a common secret format was found.' >&2
            exit 1
          fi

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build pull request image
        id: smoke-image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: kinvest-access-preflight-smoke:${{ github.sha }}
      - name: Run isolated access preflight smoke
        shell: bash
        run: scripts/docker-access-preflight-runtime-smoke.sh "kinvest-access-preflight-smoke:${{ github.sha }}"

  publish:
    needs: [verify, security, container-build]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.digest.outputs.ghcr_image_digest }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish audit-tagged image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: ghcr.io/zwphhxx/kinvest:${{ github.sha }}
          provenance: true
      - name: Validate immutable image digest
        id: digest
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_REF: ghcr.io/zwphhxx/kinvest:${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'Build action returned an invalid image digest.' >&2
            exit 1
          fi
          GHCR_DIGEST="$(docker buildx imagetools inspect "$GHCR_REF" --format '{{.Manifest.Digest}}')"
          if [[ ! "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'GHCR did not report a valid image digest.' >&2
            exit 1
          fi
          if [[ "$GHCR_DIGEST" != "$BUILD_DIGEST" ]]; then
            printf '%s\n' 'GHCR digest does not match the build output digest.' >&2
            exit 1
          fi
          printf 'ghcr_image_digest=%s\n' "$GHCR_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'GHCR image: ghcr.io/zwphhxx/kinvest@%s\n' "$GHCR_DIGEST"
      - name: Write GHCR release record v2
        shell: bash
        env:
          GHCR_DIGEST: ${{ steps.digest.outputs.ghcr_image_digest }}
          COMMIT_SHA: ${{ github.sha }}
          VERIFICATION_RUN_ID: ${{ github.run_id }}
          VERIFICATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --argjson schema_version 2 \
            --arg verification_run_id "$VERIFICATION_RUN_ID" \
            --arg verification_run_attempt "$VERIFICATION_RUN_ATTEMPT" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg artifact_source 'ghcr-public' \
            --arg source_repository 'ghcr.io/zwphhxx/kinvest' \
            --arg source_digest "$GHCR_DIGEST" \
            --arg ghcr_digest "$GHCR_DIGEST" \
            --arg created_at "$created_at" \
            '{
              schema_version: $schema_version,
              verification_run_id: $verification_run_id,
              verification_run_attempt: $verification_run_attempt,
              commit_sha: $commit_sha,
              artifact_source: $artifact_source,
              source_repository: $source_repository,
              source_digest: $source_digest,
              ghcr_digest: $ghcr_digest,
              tcr_digest: null,
              created_at: $created_at
            }' > release-record.json
          jq -e . release-record.json >/dev/null
      - name: Upload GHCR release record v2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kinvest-release-record-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-record.json
          retention-days: 30
          if-no-files-found: error
