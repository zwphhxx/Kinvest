# 手工 Production 部署：将已通过 mirror-tcr-manual.yml 镜像到 TCR 的
# 精确 digest 部署到生产服务器。必须人工触发 + Production environment 审批;
# DEPLOY_ENABLED != 'true' 时拒绝执行。服务器侧脚本保持:TCR 精确 digest 输入、
# 历史 GHCR state 兼容、verified rollback、健康检查与镜像身份校验。
name: Deploy production (manual)

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'main 分支上的完整 commit SHA(40 位小写 hex)'
        required: true
        type: string
      tcr_digest:
        description: 'TCR 镜像 digest(sha256:<64 位小写 hex>,来自 mirror workflow 输出)'
        required: true
        type: string
      confirm:
        description: '确认部署到生产时必须输入 DEPLOY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kinvest-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    permissions:
      contents: read
    steps:
      - name: Refuse when deployment is disabled
        if: ${{ vars.DEPLOY_ENABLED != 'true' }}
        shell: bash
        run: |
          printf '%s\n' 'DEPLOY_ENABLED is not true; refusing to deploy.' >&2
          exit 1
      - name: Check out main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Validate deploy inputs
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TCR_DIGEST: ${{ inputs.tcr_digest }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != 'DEPLOY' ]]; then
            printf '%s\n' 'Confirmation input must be exactly DEPLOY.' >&2
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'commit_sha must be 40 lowercase hex characters.' >&2
            exit 1
          fi
          if [[ ! "$TCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'tcr_digest must be sha256:<64 lowercase hex>.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            printf '%s\n' 'commit_sha is not part of main history.' >&2
            exit 1
          fi
      - name: Configure strict SSH trust
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            printf '%s\n' 'Invalid deployment host.' >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || ((DEPLOY_PORT < 1 || DEPLOY_PORT > 65535)); then
            printf '%s\n' 'Invalid deployment port.' >&2
            exit 1
          fi
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          known_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != '22' ]]; then
            known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Deploy exact immutable digest
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
          IMAGE_DIGEST: ${{ inputs.tcr_digest }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY='ccr.ccs.tencentyun.com/website-dev/kinvest'
          IMAGE_DIGEST_REF="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          if [[ ! "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then exit 1; fi
          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || ((DEPLOY_PORT < 1 || DEPLOY_PORT > 65535)); then exit 1; fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then exit 1; fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if [[ ! "$IMAGE_DIGEST_REF" =~ ^ccr\.ccs\.tencentyun\.com/website-dev/kinvest@sha256:[0-9a-f]{64}$ ]]; then exit 1; fi
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o LogLevel=ERROR \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $IMAGE_DIGEST_REF $DEPLOY_SHA"
      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
