name: Deploy production v5 (manual)

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Artifact-v2 release run ID; leave empty for state-reproof'
        required: false
        type: string
      provenance_mode:
        description: 'Use release artifact or exact root-owned deployment state'
        required: true
        default: artifact-v2
        type: choice
        options:
          - artifact-v2
          - state-reproof
      target_digest:
        description: 'State-reproof target sha256 digest; empty for artifact-v2'
        required: false
        type: string
      target_commit:
        description: 'State-reproof target main ancestor commit; empty for artifact-v2'
        required: false
        type: string
      target_verification_run_id:
        description: 'State-reproof target verification run ID; empty for artifact-v2'
        required: false
        type: string
      intent:
        description: 'FORWARD deploys a release, ROLLBACK selects previous state, RESTORE rebuilds lost tmpfs for current state'
        required: true
        type: choice
        options:
          - FORWARD
          - ROLLBACK
          - RESTORE
      ifind_mode:
        description: 'Select disabled or diagnostic iFinD bootstrap'
        required: true
        type: choice
        options:
          - disabled
          - diagnostic
      confirm:
        description: 'Type DEPLOY_V5, ROLLBACK_V4, RESTORE_V4, ROLLBACK_STATE_REPROOF, or RESTORE_STATE_REPROOF'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kinvest-production-v5
  cancel-in-progress: false

jobs:
  validate:
    name: validate-v5-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_source: ${{ steps.record.outputs.artifact_source || steps.reproof.outputs.artifact_source }}
      commit_sha: ${{ steps.record.outputs.commit_sha || steps.reproof.outputs.commit_sha }}
      image_digest: ${{ steps.record.outputs.image_digest || steps.reproof.outputs.image_digest }}
      provenance_mode: ${{ inputs.provenance_mode }}
      release_record_schema_version: ${{ steps.record.outputs.release_record_schema_version || steps.reproof.outputs.release_record_schema_version }}
      verification_run_id: ${{ steps.record.outputs.verification_run_id || steps.reproof.outputs.verification_run_id }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate deployment gate
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          PROVENANCE_MODE: ${{ inputs.provenance_mode }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_VERIFICATION_RUN_ID: ${{ inputs.target_verification_run_id }}
          CONFIRM: ${{ inputs.confirm }}
          INTENT: ${{ inputs.intent }}
          IFIND_MODE: ${{ inputs.ifind_mode }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == 'refs/heads/main' ]]
          [[ "$IFIND_MODE" =~ ^(disabled|diagnostic)$ ]]
          case "$PROVENANCE_MODE" in
            artifact-v2)
              [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
              [[ -z "$TARGET_DIGEST$TARGET_COMMIT$TARGET_VERIFICATION_RUN_ID" ]]
              case "$INTENT:$CONFIRM" in
                FORWARD:DEPLOY_V5|ROLLBACK:ROLLBACK_V4|RESTORE:RESTORE_V4) ;;
                *) exit 1 ;;
              esac
              ;;
            state-reproof)
              [[ -z "$RELEASE_RUN_ID" ]]
              [[ "$TARGET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
              [[ "$TARGET_VERIFICATION_RUN_ID" =~ ^[0-9]{1,20}$ ]]
              case "$INTENT:$CONFIRM" in
                ROLLBACK:ROLLBACK_STATE_REPROOF|RESTORE:RESTORE_STATE_REPROOF) ;;
                FORWARD:*) printf '%s\n' DEPLOY_V5_STATE_REPROOF_FORWARD_FORBIDDEN >&2; exit 2 ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
      - name: Verify release run provenance
        if: ${{ inputs.provenance_mode == 'artifact-v2' }}
        id: provenance
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          [[ "$(jq -r '.path' <<<"$run_json")" == '.github/workflows/deploy.yml' ]]
          [[ "$(jq -r '.event' <<<"$run_json")" == 'push' ]]
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == 'main' ]]
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == 'success' ]]
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$run_attempt" =~ ^[0-9]+$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts")"
          expected_name="kinvest-release-record-v2-${RELEASE_RUN_ID}-${run_attempt}"
          matches="$(jq --arg name "$expected_name" '[.artifacts[] | select(.expired == false and .name == $name)]' <<<"$artifacts")"
          [[ "$(jq 'length' <<<"$matches")" == '1' ]]
          printf 'run_attempt=%s\n' "$run_attempt" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Download and validate offline release attestation
        if: ${{ inputs.provenance_mode == 'artifact-v2' }}
        id: record
        shell: bash
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RUN_ATTEMPT: ${{ steps.provenance.outputs.run_attempt }}
          RUN_HEAD_SHA: ${{ steps.provenance.outputs.head_sha }}
          INTENT: ${{ inputs.intent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          record_dir="$(mktemp -d)"
          trap 'rm -rf "$record_dir"' EXIT
          gh run download "$RELEASE_RUN_ID" \
            --name "kinvest-release-record-v2-${RELEASE_RUN_ID}-${RUN_ATTEMPT}" \
            --dir "$record_dir"
          record="$record_dir/release-record.json"
          expected_keys='artifact_source commit_sha created_at ghcr_digest schema_version source_digest source_repository tcr_digest verification_run_attempt verification_run_id'
          [[ "$(jq -r 'keys | join(" ")' "$record")" == "$expected_keys" ]]
          [[ "$(jq -r '.schema_version' "$record")" == '2' ]]
          [[ "$(jq -r '.verification_run_id' "$record")" == "$RELEASE_RUN_ID" ]]
          [[ "$(jq -r '.verification_run_attempt' "$record")" == "$RUN_ATTEMPT" ]]
          commit_sha="$(jq -r '.commit_sha' "$record")"
          artifact_source="$(jq -r '.artifact_source' "$record")"
          source_repository="$(jq -r '.source_repository' "$record")"
          source_digest="$(jq -r '.source_digest' "$record")"
          ghcr_digest="$(jq -r '.ghcr_digest' "$record")"
          [[ "$commit_sha" == "$RUN_HEAD_SHA" && "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$artifact_source" == 'ghcr-public' ]]
          [[ "$source_repository" == 'ghcr.io/zwphhxx/kinvest' ]]
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ && "$source_digest" == "$ghcr_digest" ]]
          [[ "$(jq -r '.tcr_digest == null' "$record")" == 'true' ]]
          git merge-base --is-ancestor "$commit_sha" origin/main
          if [[ "$INTENT" == 'FORWARD' ]]; then
            [[ "$commit_sha" == "$(git rev-parse origin/main)" ]]
          fi
          printf 'artifact_source=%s\n' "$artifact_source" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'image_digest=%s\n' "$source_digest" >> "$GITHUB_OUTPUT"
          printf 'release_record_schema_version=2\n' >> "$GITHUB_OUTPUT"
          printf 'verification_run_id=%s\n' "$RELEASE_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Validate state reproof target
        id: reproof
        if: ${{ inputs.provenance_mode == 'state-reproof' }}
        shell: bash
        env:
          INTENT: ${{ inputs.intent }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_VERIFICATION_RUN_ID: ${{ inputs.target_verification_run_id }}
        run: |
          set -euo pipefail
          [[ "$INTENT" =~ ^(ROLLBACK|RESTORE)$ ]] || { printf '%s\n' DEPLOY_V5_STATE_REPROOF_FORWARD_FORBIDDEN >&2; exit 2; }
          [[ "$TARGET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_VERIFICATION_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
          printf 'artifact_source=ghcr-public\n' >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$TARGET_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'image_digest=%s\n' "$TARGET_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'release_record_schema_version=2\n' >> "$GITHUB_OUTPUT"
          printf 'verification_run_id=%s\n' "$TARGET_VERIFICATION_RUN_ID" >> "$GITHUB_OUTPUT"

  deploy-disabled:
    name: deploy-v5-disabled
    needs: validate
    if: ${{ inputs.ifind_mode == 'disabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check disabled Production gate identity after approval
        shell: bash
        env:
          DEPLOY_V5_ENABLED: ${{ vars.DEPLOY_V5_ENABLED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          KINVEST_DEPLOY_GATE_USER: ${{ vars.KINVEST_DEPLOY_GATE_USER }}
          KINVEST_ACCESS_CONTROL_MODE: ${{ vars.KINVEST_ACCESS_CONTROL_MODE }}
          KINVEST_IFIND_DIAGNOSTIC_MODE: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE }}
          REQUESTED_IFIND_MODE: ${{ inputs.ifind_mode }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          set +x
          [[ "$WORKFLOW_REF" == 'refs/heads/main' ]]
          [[ "$DEPLOY_V5_ENABLED" == 'true' ]]
          [[ "$REQUESTED_IFIND_MODE" == 'disabled' ]]
          [[ "$KINVEST_IFIND_DIAGNOSTIC_MODE" == "$REQUESTED_IFIND_MODE" ]]
          [[ "$KINVEST_DEPLOY_GATE_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { printf '%s\n' 'KINVEST_DEPLOY_GATE_IDENTITY_MISMATCH' >&2; exit 76; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$KINVEST_ACCESS_CONTROL_MODE" =~ ^(disabled|device-approval)$ ]]
      - name: Check out trusted deployment control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate full release provenance after approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INTENT: ${{ inputs.intent }}
          PROVENANCE_MODE: ${{ inputs.provenance_mode }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_VERIFICATION_RUN_ID: ${{ inputs.target_verification_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          VALIDATED_DIGEST: ${{ needs.validate.outputs.image_digest }}
          VALIDATED_SCHEMA: ${{ needs.validate.outputs.release_record_schema_version }}
          VALIDATED_RUN_ID: ${{ needs.validate.outputs.verification_run_id }}
        run: |
          set -euo pipefail
          set +x
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" == "$main_sha" ]] || exit 1
          if [[ "$PROVENANCE_MODE" == state-reproof ]]; then
            [[ "$INTENT" =~ ^(ROLLBACK|RESTORE)$ ]] || exit 1
            [[ "$TARGET_DIGEST" == "$VALIDATED_DIGEST" && "$TARGET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            [[ "$TARGET_COMMIT" == "$VALIDATED_COMMIT" && "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$TARGET_VERIFICATION_RUN_ID" == "$VALIDATED_RUN_ID" && "$TARGET_VERIFICATION_RUN_ID" =~ ^[0-9]{1,20}$ ]] || exit 1
            [[ "$VALIDATED_SCHEMA" == 2 ]]
            git cat-file -e "${TARGET_COMMIT}^{commit}"
            git merge-base --is-ancestor "$TARGET_COMMIT" origin/main || exit 1
          else
          [[ "$PROVENANCE_MODE" == artifact-v2 ]] || exit 1
          [[ "$RELEASE_RUN_ID" == "$VALIDATED_RUN_ID" && "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          [[ "$(jq -r '.path' <<<"$run_json")" == '.github/workflows/deploy.yml' ]] || exit 1
          [[ "$(jq -r '.event' <<<"$run_json")" == "push" ]] || exit 1
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == "main" ]] || exit 1
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]] || exit 1
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          run_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$run_attempt" =~ ^[0-9]+$ && "$run_head_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts")"
          expected_name="kinvest-release-record-v2-${RELEASE_RUN_ID}-${run_attempt}"
          matches="$(jq --arg name "$expected_name" "[.artifacts[] | select(.expired == false and .name == \$name)]" <<<"$artifacts")"
          [[ "$(jq "length" <<<"$matches")" == "1" ]] || exit 1
          record_dir="$(mktemp -d)"
          trap "rm -rf \"$record_dir\"" EXIT
          gh run download "$RELEASE_RUN_ID" --name "$expected_name" --dir "$record_dir"
          record="$record_dir/release-record.json"
          expected_keys='artifact_source commit_sha created_at ghcr_digest schema_version source_digest source_repository tcr_digest verification_run_attempt verification_run_id'
          [[ "$(jq -r "keys | join(\" \")" "$record")" == "$expected_keys" ]] || exit 1
          [[ "$(jq -r '.schema_version' "$record")" == "2" ]] || exit 1
          [[ "$(jq -r '.verification_run_id' "$record")" == "$RELEASE_RUN_ID" ]] || exit 1
          [[ "$(jq -r '.verification_run_attempt' "$record")" == "$run_attempt" ]] || exit 1
          commit_sha="$(jq -r '.commit_sha' "$record")"
          artifact_source="$(jq -r '.artifact_source' "$record")"
          source_repository="$(jq -r '.source_repository' "$record")"
          source_digest="$(jq -r '.source_digest' "$record")"
          ghcr_digest="$(jq -r '.ghcr_digest' "$record")"
          [[ "$commit_sha" == "$run_head_sha" && "$commit_sha" == "$VALIDATED_COMMIT" ]] || exit 1
          [[ "$artifact_source" == "ghcr-public" ]] || exit 1
          [[ "$source_repository" == "ghcr.io/zwphhxx/kinvest" ]] || exit 1
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$source_digest" == "$ghcr_digest" && "$source_digest" == "$VALIDATED_DIGEST" ]] || exit 1
          [[ "$(jq -r '.tcr_digest == null' "$record")" == "true" ]] || exit 1
          [[ "$VALIDATED_SCHEMA" == "2" ]] || exit 1
          git merge-base --is-ancestor "$commit_sha" origin/main || exit 1
          if [[ "$INTENT" == "FORWARD" ]]; then [[ "$commit_sha" == "$main_sha" ]] || exit 1; fi
          fi
      - name: Configure strict SSH trust
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          known_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != '22' ]]; then known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Deploy disabled payload with deploy-v5 stdin
        if: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE == 'disabled' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          KINVEST_DEPLOY_GATE_USER: ${{ vars.KINVEST_DEPLOY_GATE_USER }}
          DEPLOY_SHA: ${{ needs.validate.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
          RELEASE_SCHEMA: ${{ needs.validate.outputs.release_record_schema_version }}
          VERIFICATION_RUN_ID: ${{ needs.validate.outputs.verification_run_id }}
          PROVENANCE_MODE: ${{ needs.validate.outputs.provenance_mode }}
          INTENT: ${{ inputs.intent }}
          TMPFS_BOOTSTRAP_ENABLED: ${{ vars.TMPFS_BOOTSTRAP_ENABLED }}
          TMPFS_ADMIN_PASSWORD_VERIFIER_VERSION_ID: ${{ vars.TMPFS_ADMIN_PASSWORD_VERIFIER_VERSION_ID }}
          TMPFS_DEVICE_TOKEN_HMAC_VERSION_ID: ${{ vars.TMPFS_DEVICE_TOKEN_HMAC_VERSION_ID }}
          KINVEST_ACCESS_CONTROL_MODE: ${{ vars.KINVEST_ACCESS_CONTROL_MODE }}
          KINVEST_IFIND_DIAGNOSTIC_MODE: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE }}
          TMPFS_IFIND_REFRESH_TOKEN_VERSION_ID: ${{ vars.TMPFS_IFIND_REFRESH_TOKEN_VERSION_ID }}
          ADMIN_MATERIAL: ${{ vars.TMPFS_BOOTSTRAP_ENABLED == 'true' && secrets.KINVEST_ADMIN_PASSWORD_VERIFIER_B64URL || '' }}
          HMAC_MATERIAL: ${{ vars.TMPFS_BOOTSTRAP_ENABLED == 'true' && secrets.KINVEST_DEVICE_TOKEN_HMAC_KEY || '' }}
        run: |
          set -euo pipefail
          set +x
          deploy_user="$KINVEST_DEPLOY_GATE_USER"
          secret_admin_material="${ADMIN_MATERIAL-}"
          secret_hmac_material="${HMAC_MATERIAL-}"
          secret_ifind_material="${IFIND_MATERIAL-}"
          unset ADMIN_MATERIAL HMAC_MATERIAL IFIND_MATERIAL
          trap 'unset payload secret_admin_material secret_hmac_material secret_ifind_material admin_material hmac_material ifind_material' EXIT
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$deploy_user" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SCHEMA" == '2' ]]
          [[ "$VERIFICATION_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$INTENT" =~ ^(FORWARD|ROLLBACK|RESTORE)$ ]]
          [[ "$KINVEST_ACCESS_CONTROL_MODE" =~ ^(disabled|device-approval)$ ]]
          [[ "$KINVEST_IFIND_DIAGNOSTIC_MODE" =~ ^(disabled|diagnostic)$ ]]

          case "$TMPFS_BOOTSTRAP_ENABLED" in
            false)
              provider='disabled'
              admin_version=''
              hmac_version=''
              admin_material=''
              hmac_material=''
              ;;
            true)
              provider='github-tmpfs-v1'
              admin_version="$TMPFS_ADMIN_PASSWORD_VERIFIER_VERSION_ID"
              hmac_version="$TMPFS_DEVICE_TOKEN_HMAC_VERSION_ID"
              admin_material="$secret_admin_material"
              hmac_material="$secret_hmac_material"
              [[ "$admin_version" =~ ^v[0-9]{8}-[0-9]{3}$ ]]
              [[ "$hmac_version" =~ ^v[0-9]{8}-[0-9]{3}$ ]]
              test -n "$admin_material"
              test -n "$hmac_material"
              ;;
            *) exit 1 ;;
          esac

          case "$KINVEST_IFIND_DIAGNOSTIC_MODE" in
            disabled)
              ifind_version=''
              ifind_material=''
              ;;
            diagnostic)
              ifind_version="$TMPFS_IFIND_REFRESH_TOKEN_VERSION_ID"
              ifind_material="$secret_ifind_material"
              [[ "$ifind_version" =~ ^v[0-9]{8}-[0-9]{3}$ ]]
              [[ "$ifind_material" =~ ^[A-Za-z0-9._~-]{16,4096}$ ]]
              ;;
            *) exit 1 ;;
          esac

          image_ref="ghcr.io/zwphhxx/kinvest@${IMAGE_DIGEST}"
          [[ "$PROVENANCE_MODE" =~ ^(artifact-v2|state-reproof)$ ]]
          provenance="{\"artifactSource\":\"ghcr-public\",\"provenanceMode\":\"${PROVENANCE_MODE}\",\"releaseRecordSchemaVersion\":2,\"verificationRunId\":\"${VERIFICATION_RUN_ID}\"}"
          registry='{"host":"ghcr.io","mode":"ghcr-public","repository":"ghcr.io/zwphhxx/kinvest"}'
          policy="{\"accessControlMode\":\"${KINVEST_ACCESS_CONTROL_MODE}\",\"schemaVersion\":1}"
          [[ "$policy" == '{"accessControlMode":"disabled","schemaVersion":1}' || \
             "$policy" == '{"accessControlMode":"device-approval","schemaVersion":1}' ]]
          payload="$(
            printf '%s\n' \
              'KINVEST_DEPLOY_V5' \
              "$INTENT" \
              "$image_ref" \
              "$DEPLOY_SHA" \
              "$provenance" \
              "$registry" \
              "$provider" \
              "$admin_version" \
              "$hmac_version" \
              "$admin_material" \
              "$hmac_material" \
              "$policy" \
              "$KINVEST_IFIND_DIAGNOSTIC_MODE" \
              "$ifind_version" \
              "$ifind_material" \
              'EOF'
          )"
          printf '%s\n' "$payload" |
            python3 deploy/server/deploy-v5-contract.py validate-payload >/dev/null
          printf '%s\n' "$payload" |
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=2 \
              -o LogLevel=ERROR \
              -i "$HOME/.ssh/id_ed25519" \
              -p "$DEPLOY_PORT" \
              "$deploy_user@$DEPLOY_HOST" \
              'deploy-v5'
      - name: Verify public HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --max-time 15 https://dearmina.cn/api/health)"
          jq -e '.status == "ok" and .service == "kinvest"' <<<"$response" >/dev/null
      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

  deploy-diagnostic:
    name: deploy-v5-diagnostic
    needs: validate
    if: ${{ inputs.ifind_mode == 'diagnostic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check diagnostic Production gate identity after approval
        shell: bash
        env:
          DEPLOY_V5_ENABLED: ${{ vars.DEPLOY_V5_ENABLED }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          KINVEST_DEPLOY_GATE_USER: ${{ vars.KINVEST_DEPLOY_GATE_USER }}
          KINVEST_ACCESS_CONTROL_MODE: ${{ vars.KINVEST_ACCESS_CONTROL_MODE }}
          KINVEST_IFIND_DIAGNOSTIC_MODE: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE }}
          REQUESTED_IFIND_MODE: ${{ inputs.ifind_mode }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          set +x
          [[ "$WORKFLOW_REF" == 'refs/heads/main' ]]
          [[ "$DEPLOY_V5_ENABLED" == 'true' ]]
          [[ "$REQUESTED_IFIND_MODE" == 'diagnostic' ]]
          [[ "$KINVEST_IFIND_DIAGNOSTIC_MODE" == "$REQUESTED_IFIND_MODE" ]]
          [[ "$KINVEST_DEPLOY_GATE_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { printf '%s\n' 'KINVEST_DEPLOY_GATE_IDENTITY_MISMATCH' >&2; exit 76; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$KINVEST_ACCESS_CONTROL_MODE" =~ ^(disabled|device-approval)$ ]]
      - name: Check out trusted deployment control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate full release provenance after approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INTENT: ${{ inputs.intent }}
          PROVENANCE_MODE: ${{ inputs.provenance_mode }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          TARGET_VERIFICATION_RUN_ID: ${{ inputs.target_verification_run_id }}
          WORKFLOW_SHA: ${{ github.sha }}
          VALIDATED_COMMIT: ${{ needs.validate.outputs.commit_sha }}
          VALIDATED_DIGEST: ${{ needs.validate.outputs.image_digest }}
          VALIDATED_SCHEMA: ${{ needs.validate.outputs.release_record_schema_version }}
          VALIDATED_RUN_ID: ${{ needs.validate.outputs.verification_run_id }}
        run: |
          set -euo pipefail
          set +x
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ && "$WORKFLOW_SHA" == "$main_sha" ]] || exit 1
          if [[ "$PROVENANCE_MODE" == state-reproof ]]; then
            [[ "$INTENT" =~ ^(ROLLBACK|RESTORE)$ ]] || exit 1
            [[ "$TARGET_DIGEST" == "$VALIDATED_DIGEST" && "$TARGET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            [[ "$TARGET_COMMIT" == "$VALIDATED_COMMIT" && "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$TARGET_VERIFICATION_RUN_ID" == "$VALIDATED_RUN_ID" && "$TARGET_VERIFICATION_RUN_ID" =~ ^[0-9]{1,20}$ ]] || exit 1
            [[ "$VALIDATED_SCHEMA" == 2 ]]
            git cat-file -e "${TARGET_COMMIT}^{commit}"
            git merge-base --is-ancestor "$TARGET_COMMIT" origin/main || exit 1
          else
          [[ "$PROVENANCE_MODE" == artifact-v2 ]] || exit 1
          [[ "$RELEASE_RUN_ID" == "$VALIDATED_RUN_ID" && "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}")"
          [[ "$(jq -r '.path' <<<"$run_json")" == '.github/workflows/deploy.yml' ]] || exit 1
          [[ "$(jq -r '.event' <<<"$run_json")" == "push" ]] || exit 1
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == "main" ]] || exit 1
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]] || exit 1
          run_attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          run_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$run_attempt" =~ ^[0-9]+$ && "$run_head_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts")"
          expected_name="kinvest-release-record-v2-${RELEASE_RUN_ID}-${run_attempt}"
          matches="$(jq --arg name "$expected_name" "[.artifacts[] | select(.expired == false and .name == \$name)]" <<<"$artifacts")"
          [[ "$(jq "length" <<<"$matches")" == "1" ]] || exit 1
          record_dir="$(mktemp -d)"
          trap "rm -rf \"$record_dir\"" EXIT
          gh run download "$RELEASE_RUN_ID" --name "$expected_name" --dir "$record_dir"
          record="$record_dir/release-record.json"
          expected_keys='artifact_source commit_sha created_at ghcr_digest schema_version source_digest source_repository tcr_digest verification_run_attempt verification_run_id'
          [[ "$(jq -r "keys | join(\" \")" "$record")" == "$expected_keys" ]] || exit 1
          [[ "$(jq -r '.schema_version' "$record")" == "2" ]] || exit 1
          [[ "$(jq -r '.verification_run_id' "$record")" == "$RELEASE_RUN_ID" ]] || exit 1
          [[ "$(jq -r '.verification_run_attempt' "$record")" == "$run_attempt" ]] || exit 1
          commit_sha="$(jq -r '.commit_sha' "$record")"
          artifact_source="$(jq -r '.artifact_source' "$record")"
          source_repository="$(jq -r '.source_repository' "$record")"
          source_digest="$(jq -r '.source_digest' "$record")"
          ghcr_digest="$(jq -r '.ghcr_digest' "$record")"
          [[ "$commit_sha" == "$run_head_sha" && "$commit_sha" == "$VALIDATED_COMMIT" ]] || exit 1
          [[ "$artifact_source" == "ghcr-public" ]] || exit 1
          [[ "$source_repository" == "ghcr.io/zwphhxx/kinvest" ]] || exit 1
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "$source_digest" == "$ghcr_digest" && "$source_digest" == "$VALIDATED_DIGEST" ]] || exit 1
          [[ "$(jq -r '.tcr_digest == null' "$record")" == "true" ]] || exit 1
          [[ "$VALIDATED_SCHEMA" == "2" ]] || exit 1
          git merge-base --is-ancestor "$commit_sha" origin/main || exit 1
          if [[ "$INTENT" == "FORWARD" ]]; then [[ "$commit_sha" == "$main_sha" ]] || exit 1; fi
          fi
      - name: Configure strict SSH trust
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          known_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != '22' ]]; then known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          ssh-keygen -F "$known_host" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Deploy diagnostic payload with deploy-v5 stdin
        if: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE == 'diagnostic' }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          KINVEST_DEPLOY_GATE_USER: ${{ vars.KINVEST_DEPLOY_GATE_USER }}
          DEPLOY_SHA: ${{ needs.validate.outputs.commit_sha }}
          IMAGE_DIGEST: ${{ needs.validate.outputs.image_digest }}
          RELEASE_SCHEMA: ${{ needs.validate.outputs.release_record_schema_version }}
          VERIFICATION_RUN_ID: ${{ needs.validate.outputs.verification_run_id }}
          PROVENANCE_MODE: ${{ needs.validate.outputs.provenance_mode }}
          INTENT: ${{ inputs.intent }}
          TMPFS_BOOTSTRAP_ENABLED: ${{ vars.TMPFS_BOOTSTRAP_ENABLED }}
          TMPFS_ADMIN_PASSWORD_VERIFIER_VERSION_ID: ${{ vars.TMPFS_ADMIN_PASSWORD_VERIFIER_VERSION_ID }}
          TMPFS_DEVICE_TOKEN_HMAC_VERSION_ID: ${{ vars.TMPFS_DEVICE_TOKEN_HMAC_VERSION_ID }}
          KINVEST_ACCESS_CONTROL_MODE: ${{ vars.KINVEST_ACCESS_CONTROL_MODE }}
          KINVEST_IFIND_DIAGNOSTIC_MODE: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE }}
          TMPFS_IFIND_REFRESH_TOKEN_VERSION_ID: ${{ vars.TMPFS_IFIND_REFRESH_TOKEN_VERSION_ID }}
          ADMIN_MATERIAL: ${{ vars.TMPFS_BOOTSTRAP_ENABLED == 'true' && secrets.KINVEST_ADMIN_PASSWORD_VERIFIER_B64URL || '' }}
          HMAC_MATERIAL: ${{ vars.TMPFS_BOOTSTRAP_ENABLED == 'true' && secrets.KINVEST_DEVICE_TOKEN_HMAC_KEY || '' }}
          IFIND_MATERIAL: ${{ vars.KINVEST_IFIND_DIAGNOSTIC_MODE == 'diagnostic' && secrets.KINVEST_IFIND_REFRESH_TOKEN || '' }}
        run: |
          set -euo pipefail
          set +x
          deploy_user="$KINVEST_DEPLOY_GATE_USER"
          secret_admin_material="${ADMIN_MATERIAL-}"
          secret_hmac_material="${HMAC_MATERIAL-}"
          secret_ifind_material="${IFIND_MATERIAL-}"
          unset ADMIN_MATERIAL HMAC_MATERIAL IFIND_MATERIAL
          trap 'unset payload secret_admin_material secret_hmac_material secret_ifind_material admin_material hmac_material ifind_material' EXIT
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$deploy_user" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SCHEMA" == '2' ]]
          [[ "$VERIFICATION_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$INTENT" =~ ^(FORWARD|ROLLBACK|RESTORE)$ ]]
          [[ "$KINVEST_ACCESS_CONTROL_MODE" =~ ^(disabled|device-approval)$ ]]
          [[ "$KINVEST_IFIND_DIAGNOSTIC_MODE" =~ ^(disabled|diagnostic)$ ]]

          case "$TMPFS_BOOTSTRAP_ENABLED" in
            false)
              provider='disabled'
              admin_version=''
              hmac_version=''
              admin_material=''
              hmac_material=''
              ;;
            true)
              provider='github-tmpfs-v1'
              admin_version="$TMPFS_ADMIN_PASSWORD_VERIFIER_VERSION_ID"
              hmac_version="$TMPFS_DEVICE_TOKEN_HMAC_VERSION_ID"
              admin_material="$secret_admin_material"
              hmac_material="$secret_hmac_material"
              [[ "$admin_version" =~ ^v[0-9]{8}-[0-9]{3}$ ]]
              [[ "$hmac_version" =~ ^v[0-9]{8}-[0-9]{3}$ ]]
              test -n "$admin_material"
              test -n "$hmac_material"
              ;;
            *) exit 1 ;;
          esac

          case "$KINVEST_IFIND_DIAGNOSTIC_MODE" in
            disabled)
              ifind_version=''
              ifind_material=''
              ;;
            diagnostic)
              ifind_version="$TMPFS_IFIND_REFRESH_TOKEN_VERSION_ID"
              ifind_material="$secret_ifind_material"
              [[ "$ifind_version" =~ ^v[0-9]{8}-[0-9]{3}$ ]]
              [[ "$ifind_material" =~ ^[A-Za-z0-9._~-]{16,4096}$ ]]
              ;;
            *) exit 1 ;;
          esac

          image_ref="ghcr.io/zwphhxx/kinvest@${IMAGE_DIGEST}"
          [[ "$PROVENANCE_MODE" =~ ^(artifact-v2|state-reproof)$ ]]
          provenance="{\"artifactSource\":\"ghcr-public\",\"provenanceMode\":\"${PROVENANCE_MODE}\",\"releaseRecordSchemaVersion\":2,\"verificationRunId\":\"${VERIFICATION_RUN_ID}\"}"
          registry='{"host":"ghcr.io","mode":"ghcr-public","repository":"ghcr.io/zwphhxx/kinvest"}'
          policy="{\"accessControlMode\":\"${KINVEST_ACCESS_CONTROL_MODE}\",\"schemaVersion\":1}"
          [[ "$policy" == '{"accessControlMode":"disabled","schemaVersion":1}' || \
             "$policy" == '{"accessControlMode":"device-approval","schemaVersion":1}' ]]
          payload="$(
            printf '%s\n' \
              'KINVEST_DEPLOY_V5' \
              "$INTENT" \
              "$image_ref" \
              "$DEPLOY_SHA" \
              "$provenance" \
              "$registry" \
              "$provider" \
              "$admin_version" \
              "$hmac_version" \
              "$admin_material" \
              "$hmac_material" \
              "$policy" \
              "$KINVEST_IFIND_DIAGNOSTIC_MODE" \
              "$ifind_version" \
              "$ifind_material" \
              'EOF'
          )"
          printf '%s\n' "$payload" |
            python3 deploy/server/deploy-v5-contract.py validate-payload >/dev/null
          printf '%s\n' "$payload" |
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=2 \
              -o LogLevel=ERROR \
              -i "$HOME/.ssh/id_ed25519" \
              -p "$DEPLOY_PORT" \
              "$deploy_user@$DEPLOY_HOST" \
              'deploy-v5'
      - name: Verify public HTTPS health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-all-errors --max-time 15 https://dearmina.cn/api/health)"
          jq -e '.status == "ok" and .service == "kinvest"' <<<"$response" >/dev/null
      - name: Remove ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
