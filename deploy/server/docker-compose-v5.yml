x-kinvest-common: &kinvest-common
  image: ${KINVEST_IMAGE:?set exact runtime image ID}
  container_name: kinvest
  restart: unless-stopped
  user: "10001:10001"
  environment:
    - "TZ=${TZ:-Asia/Shanghai}"
    - PORT=4173
    - KINVEST_DB_PATH=/data/kinvest.sqlite
    - "KINVEST_SECRET_PROVIDER_MODE=${KINVEST_SECRET_PROVIDER_MODE:?set provider mode}"
    - "KINVEST_SECRET_VERSION_IDS=${KINVEST_SECRET_VERSION_IDS:?set canonical VersionId JSON}"
    - KINVEST_SECRET_BUNDLE_PATH=/run/secrets/kinvest
    - "KINVEST_ACCESS_CONTROL_MODE=${KINVEST_ACCESS_CONTROL_MODE:?set access control mode}"
    - "KINVEST_TRUSTED_PROXY_ADDRESSES=${KINVEST_TRUSTED_PROXY_ADDRESSES:?set canonical trusted proxy JSON}"
    - KINVEST_IFIND_DIAGNOSTIC_MODE
    - KINVEST_IFIND_REFRESH_TOKEN_VERSION_ID
    - KINVEST_IFIND_SECRET_BUNDLE_PATH
  expose: ["4173"]
  networks:
    web: {}
    metadata-egress:
      ipv4_address: ${KINVEST_CONTAINER_IP:?use metadata network config}
      gw_priority: 1
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4173/api/health"]
    interval: 30s
    timeout: 3s
    start_period: 5s
    retries: 3
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  kinvest:
    <<: *kinvest-common
    volumes:
      - type: bind
        source: /root/docker/kinvest/data
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: ${KINVEST_SECRET_BUNDLE_HOST_PATH:?set access bundle host path}
        target: /run/secrets/kinvest
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${KINVEST_IFIND_SECRET_BUNDLE_HOST_PATH:?set iFinD bundle host path}
        target: /run/secrets/kinvest-ifind
        read_only: true
        bind: { create_host_path: false }

networks:
  web: { external: true }
  metadata-egress:
    name: ${KINVEST_METADATA_NETWORK:?use metadata network config}
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ${KINVEST_BRIDGE_INTERFACE:?use metadata network config}
    ipam:
      config:
        - subnet: ${KINVEST_METADATA_SUBNET:?use metadata network config}
          gateway: ${KINVEST_METADATA_GATEWAY:?use metadata network config}
