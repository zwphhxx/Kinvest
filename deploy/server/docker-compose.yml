services:
  kinvest:
    image: ${KINVEST_IMAGE:-kinvest:local}
    container_name: kinvest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 4173
      KINVEST_DB_PATH: /data/kinvest.sqlite
    volumes:
      - /root/docker/kinvest/data:/data
    expose:
      - "4173"
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4173/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  web:
    external: true
